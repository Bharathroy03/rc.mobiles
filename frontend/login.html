<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - RC Mobiles &amp; Services</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary-container": "#001f3f",
                    "background": "#f8fafc",
                    "surface": "#ffffff",
                    "primary": "#001f3f"
                },
                fontFamily: {
                    sans: ["'Plus Jakarta Sans'", "Inter", "sans-serif"],
                    heading: ["'Outfit'", "'Plus Jakarta Sans'", "sans-serif"]
                }
            }
        }
    }
</script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50/40 to-slate-200/60 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800 antialiased selection:bg-blue-900 selection:text-white">

<main class="w-full max-w-sm relative z-10 space-y-6">
  <!-- Brand Logo & Store Header -->
  <div class="text-center space-y-3">
    <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-white shadow-md border border-slate-200/80">
      <img id="loginLogoImg" alt="RC Mobiles Logo" class="h-12 w-auto object-contain" src="/logo.png" onerror="this.src='/Images/Main_Logo.png'">
    </div>
    <div>
      <h1 class="font-heading text-2xl font-black tracking-tight text-slate-900 uppercase">RC MOBILES &amp; SERVICES</h1>
      <p class="text-xs text-slate-500 font-semibold mt-0.5">Billing &amp; Stock ERP Portal</p>
    </div>
  </div>

  <!-- Main Login Card (Clean Light Theme) -->
  <div class="bg-white rounded-3xl p-7 shadow-xl border border-slate-200/80 space-y-5">
    <div>
      <h2 class="font-extrabold text-lg tracking-tight text-slate-900">Sign In</h2>
      <p class="text-xs text-slate-500 mt-0.5">Enter your credentials to access the portal</p>
    </div>

    <!-- Error Alert Box -->
    <div id="loginAlert" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-center gap-2.5 shadow-sm">
      <span class="material-symbols-outlined text-red-600 text-lg shrink-0">error</span>
      <span id="loginAlertText" class="flex-1">Invalid credentials</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4 text-xs" onsubmit="handleLogin(event)">
      <div>
        <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1.5 text-[11px]">Username or Employee ID</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-3 text-slate-400 text-lg">person</span>
          <input type="text" id="loginUsername" required autocomplete="username" autofocus placeholder="Enter Username or Employee ID" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container focus:outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1.5 text-[11px]">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-3 text-slate-400 text-lg">lock</span>
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="Enter Password" class="w-full pl-10 pr-11 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container focus:outline-none transition-all">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 p-1 text-slate-400 hover:text-slate-700 transition-colors" title="Toggle password visibility">
            <span id="pwdToggleIcon" class="material-symbols-outlined text-lg">visibility</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-0.5">
        <label class="flex items-center gap-2 cursor-pointer text-slate-600 hover:text-slate-900 font-medium select-none">
          <input type="checkbox" id="rememberMe" checked class="rounded border-slate-300 bg-white text-primary-container focus:ring-primary-container">
          <span class="text-xs font-semibold">Remember me</span>
        </label>
      </div>

      <button type="submit" id="loginSubmitBtn" class="w-full bg-primary-container hover:bg-slate-900 text-white py-3 rounded-xl font-extrabold text-sm tracking-wide transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 active:scale-[0.99]">
        <span class="material-symbols-outlined text-lg">login</span> Sign In
      </button>
    </form>
  </div>

  <!-- Clean Minimalist Footer -->
  <footer class="text-center text-[11px] text-slate-400 font-medium">
    <p>&copy; 2026 RC Mobiles &amp; Services. All rights reserved.</p>
  </footer>
</main>

<script src="auth.js"></script>
<script>
function togglePasswordVisibility() {
    const pwd = document.getElementById("loginPassword");
    const icon = document.getElementById("pwdToggleIcon");
    if (pwd.type === "password") {
        pwd.type = "text";
        icon.textContent = "visibility_off";
    } else {
        pwd.type = "password";
        icon.textContent = "visibility";
    }
}

function showAlert(msg) {
    const alert = document.getElementById("loginAlert");
    document.getElementById("loginAlertText").textContent = msg;
    alert.classList.remove("hidden");
}

function hideAlert() {
    document.getElementById("loginAlert").classList.add("hidden");
}

// Clear alert on typing
document.getElementById("loginUsername").addEventListener("input", hideAlert);
document.getElementById("loginPassword").addEventListener("input", hideAlert);

async function handleLogin(e) {
    e.preventDefault();
    hideAlert();

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;
    const remember = document.getElementById("rememberMe").checked;
    const btn = document.getElementById("loginSubmitBtn");

    if (!username || !password) {
        showAlert("Please enter both username and password");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-lg animate-spin">progress_activity</span> Signing In...`;

    try {
        const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success && data.user) {
            RC_AUTH.setUser(data.user, remember);
            btn.innerHTML = `<span class="material-symbols-outlined text-lg">check_circle</span> Welcome ${escapeHtml(data.user.full_name || data.user.username)}!`;
            btn.className = "w-full bg-emerald-600 text-white py-3 rounded-xl font-extrabold text-sm tracking-wide transition-all shadow-md flex items-center justify-center gap-2";
            setTimeout(() => {
                window.location.href = "index.html";
            }, 350);
        } else {
            showAlert(data.error || "Invalid username or password");
            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-outlined text-lg">login</span> Sign In`;
        }
    } catch (err) {
        console.error("Login error:", err);
        showAlert("Connection failed. Please ensure the backend server is running.");
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-lg">login</span> Sign In`;
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
</script>
</body>
</html>
